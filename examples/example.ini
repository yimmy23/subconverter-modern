; Minimal external template for SubConverter Modern.
; This follows the classic SubConverter-style custom_proxy_group/ruleset syntax.
; Do not put private subscription URLs or node credentials in this file.

custom_proxy_group=Proxy`select`[]AUTO`[]DIRECT`.*
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,5,100

ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=Proxy,[]DOMAIN-SUFFIX,example.com
ruleset=Proxy,[]FINAL
